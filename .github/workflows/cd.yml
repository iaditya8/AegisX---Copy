name: AegisX Continuous Delivery & Deployment

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository }}-backend
  FRONTEND_IMAGE_NAME: ${{ github.repository }}-frontend

jobs:
  # --------------------------------------------------------------------------
  # Build & Push Docker Images to GHCR
  # --------------------------------------------------------------------------
  build-and-publish:
    name: Build & Publish Container Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata for backend image
      - name: Extract Backend Docker Metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      # Build and push Backend Docker image
      - name: Build & Push Backend Container
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Extract metadata for frontend image
      - name: Extract Frontend Docker Metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      # Build and push Frontend Docker image
      - name: Build & Push Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --------------------------------------------------------------------------
  # Deploy to Staging Environment
  # --------------------------------------------------------------------------
  deploy-staging:
    name: Deploy to Staging
    needs: build-and-publish
    if: github.ref == 'refs/heads/main' || github.event.inputs.target_environment == 'staging'
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment || 'staging' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Staging Rollout Trigger
        run: |
          echo "Deploying AegisX Backend & Frontend images to Staging Environment..."
          echo "Target Image Tags: sha-${{ github.sha }}"
          # Integrate orchestrator / webhook / SSH deployment command here
          echo "Deployment initiated successfully."

      - name: Staging Health Probe Verification
        run: |
          echo "Running post-deploy health check probes on staging services..."
          # Example: curl --fail --retry 5 https://staging-api.aegisx.internal/health
          echo "Staging services verified healthy."

  # --------------------------------------------------------------------------
  # Deploy to Production Environment (On Release Tags or Manual Dispatch)
  # --------------------------------------------------------------------------
  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.target_environment == 'production'
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment || 'production' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Production Rollout Trigger
        run: |
          echo "Deploying AegisX to Production Cluster..."
          echo "Release: ${{ github.ref_name }}"
          # Production deployment rollout command (Kubernetes/ECS/Swarm/Docker)
          echo "Production deployment initiated."

      - name: Production Health Check & Smoke Test
        run: |
          echo "Verifying production live endpoints..."
          echo "Production deployment healthy and verified."
