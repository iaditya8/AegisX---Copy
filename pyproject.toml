[tool.poetry]
name = "aegisx"
version = "0.1.0"
description = "AegisX Security Operations & Intelligence Platform"
authors = ["Aditya <aditya@example.com>"]
readme = "Docs/README.md"
packages = [{include = "src", from = "backend"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
fastapi = ">=0.100.0"
uvicorn = {extras = ["standard"], version = ">=0.23.0"}
sqlalchemy = ">=2.0.0"
asyncpg = ">=0.29.0"
aiosqlite = ">=0.19.0"
alembic = ">=1.12.0"
pydantic = ">=2.0.0"
pydantic-settings = ">=2.0.0"
redis = ">=5.0.0"
celery = ">=5.3.0"
pyjwt = ">=2.8.0"
bcrypt = ">=4.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pytest-asyncio = ">=0.23.0"
httpx = ">=0.27.0"
ruff = ">=0.4.0"
black = ">=24.0.0"
isort = ">=5.13.0"
pytest-cov = ">=5.0.0"
pip-audit = ">=2.7.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E402", "E501", "E711", "E712", "F401", "F541", "F811", "F841", "I001", "W291", "W292", "W293"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.pyright]
extraPaths = ["backend"]
