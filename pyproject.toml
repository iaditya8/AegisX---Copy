[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E402", "E501", "E711", "E712", "F401", "F541", "F811", "F841", "I001", "W291", "W292", "W293"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.pyright]
extraPaths = ["backend"]
